name: TestingOne
on:
  push:
    branches:
      - main
jobs:
  build:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: java download
        uses: actions/setup-java@v5.2.0
        env:
           APP_NAME: mobile-api
        with:
          distribution: temurin
          java-version: 21
          
      - name: Log Command
        run: echo ${{ secrets.NAME }}
      - name: Log Variables
        run: echo ${{ vars.NAME }}
      
